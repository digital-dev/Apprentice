# Opt-in route for the AppImage build, which cannot carry CAP_SYS_PTRACE (the
# squashfs it runs from is mounted read-only, so setcap has nothing to act
# on — see Linux/packaging/after-install.sh, the .deb's equivalent). Install
# with:
#   sudo cp Linux/packaging/99-apprentice-ptrace.conf /etc/sysctl.d/
#   sudo sysctl --system
# or apply for the current boot only with:
#   sudo sysctl kernel.yama.ptrace_scope=0
# See Linux/README.md and ipc.ts's ptraceHelp() for when each is suggested.
kernel.yama.ptrace_scope = 0
